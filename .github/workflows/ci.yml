name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: rg-novacart-dev
  FRONTEND_APP: novacart-dev-frontend
  BACKEND_APP: novacart-dev-backend

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: novacart/backend/requirements.txt

      - name: Install dependencies
        working-directory: novacart/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Run backend tests
        working-directory: novacart/backend
        run: |
          python -m pytest -q

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
     
      - name: Azure login using OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az acr login --name "$ACR_NAME"
      
      - name: Build and publish frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./novacart/frontend
          file: ./novacart/frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.ACR_LOGIN_SERVER }}/novacart-frontend:${{ env.IMAGE_TAG }}
      
      - name: Build and publish backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./novacart/backend
          file: ./novacart/backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.ACR_LOGIN_SERVER }}/novacart-backend:${{ env.IMAGE_TAG }}
      
      - name: Deploy frontend and backend to Azure Container Apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
        run: |

          az containerapp update \
            --name "$BACKEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/novacart-backend@$BACKEND_DIGEST"

          az containerapp update \
            --name "$FRONTEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/novacart-frontend@$FRONTEND_DIGEST"



      