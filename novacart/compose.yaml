services:

  frontend:
    image: novacart-frontend:1.0
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: novacart-backend:1.0
    environment:
      APP_ENV: container
      API_VERSION: v1
      DATABASE_URL: postgresql://novacart:novacart@postgres:5432/novacart
      LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: novacart
      POSTGRES_PASSWORD: novacart
      POSTGRES_DB: novacart
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novacart -d novacart"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: